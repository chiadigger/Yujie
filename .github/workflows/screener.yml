name: tw-stock-screener

on:
  schedule:
    - cron: "0 12 * * 1-5"   # UTC 12:00 = 台灣時間 20:00，週一到週五
  workflow_dispatch:          # 也可手動按 Run workflow

permissions:
  contents: write             # 讓 workflow 能把結果 commit 回 repo

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas yfinance lxml requests
      - run: python screener.py
      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "update results" && git push)
